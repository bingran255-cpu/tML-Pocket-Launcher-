name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'managed/**'
      - 'external/**'
      - 'ui/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract project tarball
        run: |
          # 如果仓库里上传了 tml-build.tar.gz，先解压覆盖
          if [ -f "tml-build.tar.gz" ]; then
            echo ">>> Extracting tml-build.tar.gz..."
            tar xzf tml-build.tar.gz
            rm tml-build.tar.gz
          fi

      - name: Create Directory.Build.props
        run: |
          if [ ! -f Directory.Build.props ]; then
            printf '%s\n' '<Project>' '  <Import Project="managed/Directory.Build.props" />' '</Project>' > Directory.Build.props
            echo "Created root Directory.Build.props"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-package: jdk
          distribution: temurin
          java-version: "21"

      - name: Set up .NET SDK 10
        run: |
          wget -qO dotnet-install.sh https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --version 10.0.101 --install-dir /usr/share/dotnet
          echo "/usr/share/dotnet" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android SDK
        run: mkdir -p /opt/android-sdk/cmdline-tools && wget -q -O cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" && unzip -q cmdtools.zip -d /opt/android-sdk/cmdline-tools/ && mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest && echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV && echo "/opt/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH && echo "/opt/android-sdk/platform-tools" >> $GITHUB_PATH
      - name: Install NDK and CMake
        run: yes | sdkmanager --licenses && sdkmanager "ndk;30.0.14904198" "cmake;3.22.1" "build-tools;37.0.0" "platforms;android-36" "platform-tools"
      - name: Download tModLoader release
        run: |
          mkdir -p /tmp/tml
          curl -L --fail --retry 3 -o /tmp/tml/tModLoader.zip \
            "https://github.com/tModLoader/tModLoader/releases/download/v2026.09.3.1/tModLoader.zip"

      - name: Extract game references
        run: |
          mkdir -p build/game-references
          unzip -q /tmp/tml/tModLoader.zip -d /tmp/tml/extracted
          EXT=/tmp/tml/extracted
          cp $EXT/tModLoader.dll build/game-references/
          find $EXT -name "FNA.dll" -not -path "*/runtime/*" -not -path "*/BuildHost-netcore/*" -exec cp {} build/game-references/ \;
          find $EXT -name "ReLogic.dll" -not -path "*/runtime/*" -not -path "*/BuildHost-netcore/*" -exec cp {} build/game-references/ \;
          find $EXT -name "TerrariaHooks.dll" -not -path "*/runtime/*" -not -path "*/BuildHost-netcore/*" -exec cp {} build/game-references/ \;
          find $EXT -name "Newtonsoft.Json.dll" -not -path "*/runtime/*" -not -path "*/BuildHost-netcore/*" -exec cp {} build/game-references/ \;
          find $EXT -name "log4net.dll" -not -path "*/runtime/*" -not -path "*/BuildHost-netcore/*" -exec cp {} build/game-references/ \;
          find $EXT -name "Hjson.dll" -not -path "*/runtime/*" -not -path "*/BuildHost-netcore/*" -exec cp {} build/game-references/ \;
          echo "$EXT" > build/game-references/source.txt

      - name: Build .NET managed layer
        run: |
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet build MobileLauncher.slnx -c Release

      - name: Build launcher assets
        run: |
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          REPO_ROOT=$(pwd)

          rm -rf build/launcher-publish android/app/src/main/assets/launcher android/app/src/main/assets/game

          dotnet publish managed/MobileLauncher.Host/MobileLauncher.Host.csproj -c Release -r linux-arm64 --self-contained false -o build/launcher-publish
          dotnet publish managed/MobileLauncher.Stores/MobileLauncher.Stores.csproj -c Release -r linux-arm64 --self-contained false -o build/launcher-publish/Stores

          mkdir -p android/app/src/main/assets/launcher
          cp -r build/launcher-publish/* android/app/src/main/assets/launcher/

          dotnet build managed/MobileLauncher.Controls/MobileLauncher.Controls.csproj -c Release --nologo
          cp managed/MobileLauncher.Controls/bin/Release/net10.0/MobileLauncher.Controls.dll android/app/src/main/assets/launcher/

          dotnet build external/tML-Pocket-Patches/MobileLauncher.Patches.csproj -c Release --nologo \
            -p:LauncherRoot="$REPO_ROOT" \
            -p:DirectoryBuildPropsPath="$REPO_ROOT/managed/Directory.Build.props"
          cp external/tML-Pocket-Patches/bin/Release/net10.0/MobileLauncher.Patches.dll android/app/src/main/assets/launcher/
          cp external/tML-Pocket-Patches/LICENSE android/app/src/main/assets/launcher/RotatingartLauncher-LICENSE.txt 2>/dev/null || true

      - name: Build React UI
        run: |
          cd ui/launcher
          npm ci
          npx tsc --noEmit
          npx vite build
          rm -rf ../../android/app/src/main/assets/ui
          mkdir -p ../../android/app/src/main/assets/ui
          cp -r dist/* ../../android/app/src/main/assets/ui/
          find ../../android/app/src/main/assets/ui -name "*.map" -delete
          rm -f ../../android/app/src/main/assets/ui/preview.html

      - name: Install PowerShell
        run: wget -qO /tmp/powershell.tar.gz "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-x64.tar.gz" && mkdir -p /opt/powershell && tar xzf /tmp/powershell.tar.gz -C /opt/powershell && chmod +x /opt/powershell/pwsh && ln -sf /opt/powershell/pwsh /usr/local/bin/powershell && powershell --version
  
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain -PdefaultTmlArchive=/tmp/tml/tModLoader.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tML-Pocket-Launcher-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

